name: Build and push AUTH image

on:
  push:
    branches:
      - main
    paths:
      - 'services/auth/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/auth
          push: true
          tags: |
            ghcr.io/christheoreo/photo-k8-app/auth:latest
            ghcr.io/christheoreo/photo-k8-app/auth:${{ github.sha }}

      - name: Update k8s manifest with new image tag
        run: |
          sed -i "s|ghcr.io/christheoreo/photo-k8-app/auth:.*|ghcr.io/christheoreo/photo-k8-app/auth:${{ github.sha }}|" k8s/auth/deployment.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/auth/deployment.yaml
          git commit -m "chore: update AUTH image to ${{ github.sha }}"
          
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push failed, retrying in 5s... (attempt $i)"
            sleep 5
          done