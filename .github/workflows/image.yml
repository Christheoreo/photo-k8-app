name: Build and push IMAGE image

on:
  push:
    branches:
      - main
    paths:
      - 'services/image/**'

concurrency:
  group: manifest-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/image
          push: true
          tags: |
            ghcr.io/christheoreo/photo-k8-app/image-worker:latest
            ghcr.io/christheoreo/photo-k8-app/image-worker:${{ github.sha }}

      - name: Update k8s manifest with new image tag
        run: |
          sed -i "s|ghcr.io/christheoreo/photo-k8-app/image-worker:.*|ghcr.io/christheoreo/photo-k8-app/image-worker:${{ github.sha }}|" k8s/image/deployment.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/image/deployment.yaml
          git commit -m "chore: update IMAGE image to ${{ github.sha }}"
          git push