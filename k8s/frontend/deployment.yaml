apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: photo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/christheoreo/photo-k8-app/frontend:615de8c60c0e971ee7e1dc0a610fb9558b8a4a28
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: photo-app
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80