apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: photo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/christheoreo/photo-k8-app/frontend:e4d2bf468850cded7d50b352f9ed8048f47a7a81
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: photo-app
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80