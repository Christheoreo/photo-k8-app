apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-worker
  namespace: photo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-worker
  template:
    metadata:
      labels:
        app: image-worker
    spec:
      containers:
      - name: image-worker
        image: ghcr.io/christheoreo/photo-k8-app/image-worker:bc1b500f263d1bee5b056e62b6064170bf65cd39
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: image-secret
              key: database-url
        - name: VALKEY_HOST
          value: "valkey"
        - name: VALKEY_PORT
          value: "6379"