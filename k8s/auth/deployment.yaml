apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: photo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: ghcr.io/christheoreo/photo-k8-app/auth:34317114518a406a74050bf3e04cf5c27a40b1f0
        ports:
        - containerPort: 3001
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: auth-secret
              key: database-url
        - name: PORT
          value: "3001"
        - name: NODE_ENV
          value: "production"
        volumeMounts:
        - name: auth-keys
          mountPath: /app/keys
          readOnly: true
      volumes:
      - name: auth-keys
        secret:
          secretName: auth-keys
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: photo-app
spec:
  selector:
    app: auth
  ports:
  - port: 3001
    targetPort: 3001