apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: photo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: ghcr.io/christheoreo/photo-k8-app/auth:34172f6cb2e903f5cb293b69e26c00f285562bfa
        ports:
        - containerPort: 3001
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: auth-secret
              key: database-url
        - name: PORT
          value: "3001"
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: photo-app
spec:
  selector:
    app: auth
  ports:
  - port: 3001
    targetPort: 3001